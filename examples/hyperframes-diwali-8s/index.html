<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #1c060d;
      }
      #root { position: relative; width: 100%; height: 100%; }
      .bg {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 30%, #5a1220 0%, #1c060d 62%);
      }
      .ring {
        position: absolute; left: 50%; top: 1500px; width: 620px; height: 420px;
        margin-left: -310px; border: 2px solid rgba(245, 192, 78, 0.35); border-radius: 50%;
      }
      .ring2 {
        position: absolute; left: 50%; top: 1560px; width: 500px; height: 360px;
        margin-left: -250px; border: 1px solid rgba(245, 192, 78, 0.2); border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <div class="bg"></div>
      <div class="ring"></div>
      <div class="ring2"></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="product"
        data-composition-id="product"
        data-composition-src="compositions/product.html"
        data-start="2.5"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="cta"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="5.5"
        data-duration="2.5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
